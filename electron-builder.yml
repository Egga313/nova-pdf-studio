appId: studio.nova.pdf
productName: NOVA PDF Studio
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/**
  - node_modules/tesseract.js-core/**
extraResources:
  - from: resources
    to: resources
win:
  target:
    - nsis
  artifactName: NOVA-PDF-Studio-Setup-${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerLanguages:
    - ar_SA
    - fr_FR
    - en_US
mac:
  target: dmg
  category: public.app-category.productivity
