appId: studio.nova.pdf
productName: NOVA PDF Studio
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/**
  - node_modules/tesseract.js-core/**
  - node_modules/tesseract.js/**
  # يحتاجها عامل OCR (worker_threads خارج asar)
  - node_modules/bmp-js/**
  - node_modules/is-electron/**
  - node_modules/is-url/**
  - node_modules/node-fetch/**
  - node_modules/regenerator-runtime/**
  - node_modules/wasm-feature-detect/**
  - node_modules/whatwg-url/**
  - node_modules/tr46/**
  - node_modules/webidl-conversions/**
extraResources:
  - from: resources
    to: resources
# يكتب اسم/وصف/أيقونة الملف التنفيذي عبر rcedit (بديل عن signAndEditExecutable)
afterPack: build/afterPack.cjs
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: NOVA-PDF-Studio-Setup-${version}.exe
  # لا توقيع رقمي؛ وتعطيل تحرير موارد exe يمنع تنزيل winCodeSign الذي يحتاج صلاحية إنشاء symlink على Windows
  signAndEditExecutable: false
  forceCodeSigning: false
  fileAssociations:
    - ext: pdf
      name: PDF Document
      description: PDF Document
      icon: build/icon.ico
    - ext: xlsx
      name: Excel Workbook
      description: Excel Workbook
    - ext: csv
      name: CSV File
      description: CSV File
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerLanguages:
    - ar_SA
    - fr_FR
    - en_US
    - es_ES
    - de_DE
    - it_IT
    - pt_BR
    - tr_TR
    - ru_RU
    - zh_CN
    - ja_JP
    # hi_IN و fa_IR غير مدرجتين: Hindi.nsh معطوب وPersian.nlf غير موجود في NSIS 3.0.4 — واجهة التطبيق نفسها تدعم الهندية والفارسية
    - id_ID
mac:
  target: dmg
  category: public.app-category.productivity
