appId: studio.nova.pdf
productName: NOVA PDF Studio
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/**
  - node_modules/tesseract.js-core/**
  - node_modules/tesseract.js/**
  # يحتاجها عامل OCR (worker_threads خارج asar)
  - node_modules/bmp-js/**
  - node_modules/is-electron/**
  - node_modules/is-url/**
  - node_modules/node-fetch/**
  - node_modules/regenerator-runtime/**
  - node_modules/wasm-feature-detect/**
  - node_modules/whatwg-url/**
  - node_modules/tr46/**
  - node_modules/webidl-conversions/**
extraResources:
  - from: resources
    to: resources
win:
  target:
    - nsis
  artifactName: NOVA-PDF-Studio-Setup-${version}.exe
  # لا توقيع رقمي؛ وتعطيل تحرير موارد exe يمنع تنزيل winCodeSign الذي يحتاج صلاحية إنشاء symlink على Windows
  signAndEditExecutable: false
  forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerLanguages:
    - ar_SA
    - fr_FR
    - en_US
mac:
  target: dmg
  category: public.app-category.productivity
